name: GBOR Prize Accounting CI

on:
  push:
    branches: [main]
    paths:
      - 'gbor_logic_ci/accounting_state_test.py'
      - '.github/workflows/gbor-prize-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prize-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify WIN COLLECT second START
        run: python gbor_logic_ci/accounting_state_test.py
