name: GBOR Log Lock Windows Test

on:
  push:
    branches: [main]
    paths:
      - 'gbor_logfix_ci/**'
      - '.github/workflows/gbor-logfix-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run log-lock harness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src = Get-Content -Raw 'gbor_logfix_ci/LogLockHarness.cs'
          Add-Type -TypeDefinition $src -Language CSharp
          $root = Join-Path $env:RUNNER_TEMP 'gbor-logfix'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [LogLockHarness]::Main(@($root))
