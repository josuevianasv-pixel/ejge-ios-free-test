name: Public Runner Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove hosted runner allocation
        run: |
          echo "runner allocated"
          uname -a
