name: EJGE Landscape-Start iPhone Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ejge-landscape-start.yml'
      - 'tests/ejge-landscape-start.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EJGE_TEST_URL: https://goalmania-d1-engine-test.josuevianasv.workers.dev/login
      EJGE_USERNAME: ${{ secrets.EJGE_USERNAME }}
      EJGE_PASSWORD: ${{ secrets.EJGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - run: node tests/ejge-landscape-start.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejge-landscape-start-results
          path: artifacts/ejge-landscape-start/
          retention-days: 7
